[www]
user = www-data
group = www-data
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.process_idle_timeout = 10s
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
ping.path = /ping
ping.response = pong
clear_env = no
