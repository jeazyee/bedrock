user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/json application/rss+xml application/xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'cache=$upstream_cache_status';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    server_tokens off;
    server_names_hash_bucket_size 128;

    client_max_body_size 64m;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;

    fastcgi_cache_path /var/cache/nginx/fastcgi
        levels=1:2
        keys_zone=WORDPRESS:100m
        inactive=60m
        max_size=512m
        use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 5s;

    limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

    map $http_x_forwarded_proto $fastcgi_https {
        default $https;
        https on;
    }

    map $request_method $skip_cache_method {
        default 0;
        POST 1;
    }

    map $http_cookie $skip_cache_cookie {
        default 0;
        "~*wordpress_logged_in_" 1;
        "~*wp-postpass_" 1;
        "~*comment_author_" 1;
        "~*woocommerce_items_in_cart" 1;
        "~*woocommerce_cart_hash" 1;
    }

    map $request_uri $skip_cache_uri {
        default 0;
        "~*/wp-admin" 1;
        "~*/wp-login\\.php" 1;
        "~*/xmlrpc\\.php" 1;
        "~*/wp-cron\\.php" 1;
        "~*/wp-json" 1;
        "~*/cart" 1;
        "~*/checkout" 1;
        "~*/my-account" 1;
        "~*/wc-api" 1;
    }

    map $arg_preview $skip_cache_preview {
        default 0;
        true 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
