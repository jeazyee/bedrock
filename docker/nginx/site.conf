server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/web;
    index index.php;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    port_in_redirect off;
    absolute_redirect off;

    include /etc/nginx/headers.conf;

    set $skip_cache 0;
    if ($skip_cache_method) { set $skip_cache 1; }
    if ($skip_cache_cookie) { set $skip_cache 1; }
    if ($skip_cache_uri) { set $skip_cache 1; }
    if ($skip_cache_preview) { set $skip_cache 1; }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =204;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(\.env|composer\.(json|lock)|package(-lock)?\.json|auth\.json)$ {
        deny all;
    }

    location = /wp/xmlrpc.php {
        deny all;
    }

    location = /wp/wp-login.php {
        limit_req zone=login burst=4 nodelay;
        include /etc/nginx/fastcgi-php.conf;
    }

    location ~* ^/app/uploads/ {
        open_file_cache off;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
        include /etc/nginx/headers.conf;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|svgz|webp|avif|ico|woff2?|ttf|eot|otf|mp4|webm|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        include /etc/nginx/headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi-php.conf;
    }
}
