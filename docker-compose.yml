# Production stack. Dokploy uses this file by default.
# Environment: paste a Bedrock .env (see .env.example). WP_HOME is required.
# If DB_PASSWORD / salts are omitted, they are generated on first boot.
# Local development: docker compose -f docker-compose.dev.yml up -d

x-php: &php
  build:
    context: .
    dockerfile: Dockerfile
    target: php
  image: ${COMPOSE_PROJECT_NAME:-bedrock}-php
  env_file:
    - .env
  environment:
    DB_HOST: database
    WP_HOME: ${WP_HOME:-}
    WP_ENV: ${WP_ENV:-production}
    WP_REDIS_HOST: redis
    DISABLE_WP_CRON: "true"
    WP_CLI_ALLOW_ROOT: "1"
  volumes:
    - uploads:/var/www/html/web/app/uploads
    - config:/var/www/html/.config
    - .env:/run/dotenv:ro
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  init: true
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  secrets-init:
    image: busybox:1.37
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    volumes:
      - config:/config
    command:
      - sh
      - -c
      - |
        mkdir -p /config
        if [ ! -s /config/db_password ]; then
          if [ -n "$$DB_PASSWORD" ]; then
            printf '%s' "$$DB_PASSWORD" > /config/db_password
          else
            tr -d '-' < /proc/sys/kernel/random/uuid > /tmp/u
            head -c 32 /tmp/u > /config/db_password
          fi
        fi
        if [ ! -s /config/db_root_password ]; then
          if [ -n "$$DB_ROOT_PASSWORD" ]; then
            printf '%s' "$$DB_ROOT_PASSWORD" > /config/db_root_password
          elif [ -n "$$DB_PASSWORD" ]; then
            printf '%s' "$$DB_PASSWORD" > /config/db_root_password
          else
            tr -d '-' < /proc/sys/kernel/random/uuid > /tmp/r
            head -c 32 /tmp/r > /config/db_root_password
          fi
        fi
        chmod 644 /config/db_password /config/db_root_password
        echo "Database secrets are ready"
    restart: on-failure

  php:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: ${COMPOSE_PROJECT_NAME:-bedrock}-nginx
    ports:
      - "80"
    volumes:
      - uploads:/var/www/html/web/app/uploads:ro
    tmpfs:
      - /var/cache/nginx/fastcgi:size=512m,mode=1777
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - default
      - dokploy-network

  cron:
    <<: *php
    command:
      - sh
      - -c
      - |
        until wp core is-installed --allow-root >/dev/null 2>&1; do sleep 10; done
        while true; do wp cron event run --due-now --allow-root --quiet || true; sleep 60; done
    healthcheck:
      disable: true

  database:
    image: mariadb:11.8
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD_FILE: /run/mariadb-secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/mariadb-secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
      - config:/run/mariadb-secrets:ro
    depends_on:
      - secrets-init
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Waiting for database secrets..."
        i=0
        while [ $$i -lt 90 ]; do
          if [ -s /run/mariadb-secrets/db_password ] && [ -s /run/mariadb-secrets/db_root_password ]; then
            exec docker-entrypoint.sh "$$@"
          fi
          i=$$((i + 1))
          sleep 1
        done
        echo "Timed out waiting for DB secrets" >&2
        exit 1
      - --
    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-file-per-table=1
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  uploads:
  redis_data:
  config:

networks:
  dokploy-network:
    external: true
